<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你的食人花很担心你：第二天</title>
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/scenes/next_day.css" />
</head>
<body>
  <div class="game-shell">
    <section id="scene" class="scene blackout-mode" aria-label="第三场景：清晨诊室">
      <div class="scene-title">第三场景 · 次日清晨</div>
      <div id="hintText" class="hint">点击任意位置继续</div>

      <button id="sceneHotspot" class="scene-hotspot" aria-label="点击场景推进"></button>

      <div id="corridorSet" class="corridor-arch hidden" aria-hidden="true">
        <div class="corridor-roof"></div>
        <div class="corridor-path"></div>
      </div>

      <div id="hallSet" class="hall-interior hidden" aria-hidden="true">
        <div class="lamp left"></div>
        <div class="lamp right"></div>
        <div class="desk"></div>
        <div class="floor"></div>
      </div>

      <div id="entryDoor" class="entry-door hidden" aria-hidden="true"></div>

      <button id="guide" class="character guide hidden" aria-label="点击接引人">
        <div class="glow"></div>
        <div class="sprite"></div>
        <div class="label">接引人</div>
      </button>

      <button id="doctor" class="character doctor hidden" aria-label="点击医馆主人">
        <div class="glow"></div>
        <div class="sprite"></div>
        <div class="label">医馆主人</div>
      </button>
    </section>

    <section class="dialogue-panel" aria-label="对话框">
      <div class="dialogue-inner">
        <div class="speaker-column">
          <div id="speaker" class="nameplate">描述</div>
          <div id="speakerName" class="speaker-name">描述</div>
        </div>
        <div class="dialogue-main">
          <div id="dialogueText" class="dialogue-text">……</div>
        </div>
        <div class="dialogue-actions">
          <button id="resetBtn" class="btn">重置场景</button>
        </div>
      </div>
    </section>

    <section class="inventory-panel" aria-label="物品栏">
      <div class="inventory-inner">
        <div class="panel-title">物品栏</div>
        <div id="inventoryList" class="inventory-list"></div>
        <div id="itemDetail" class="item-detail">
          <strong>当前目标</strong>
          弄清楚这里究竟是什么地方
        </div>
      </div>
    </section>
  </div>

  <script src="./js/core/items.js"></script>
  <script src="./js/core/state.js"></script>
  <script src="./js/core/helpers.js"></script>
  <script src="./js/core/speakerMeta.js"></script>
  <script src="./js/core/ui.js"></script>
  <script src="./js/scenes/next_day.js"></script>
  <script>
    window.APP.scenes.mountNextDayScene();
  </script>
</body>
</html>
