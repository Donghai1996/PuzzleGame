<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你的食人花很担心你：医馆前厅</title>
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/scenes/courtyard.css" />
</head>
<body>
  <div class="game-shell">
    <section id="scene" class="scene corridor-mode" aria-label="走廊与医馆前厅场景">
      <div class="scene-title">第二场景 · 走廊</div>
      <div id="hintText" class="hint">这里是安全的</div>

      <button id="sceneHotspot" class="scene-hotspot" aria-label="点击场景推进"></button>

      <div id="corridorSet" class="corridor-arch" aria-hidden="true">
        <div class="corridor-roof"></div>
        <div class="corridor-path"></div>
      </div>

      <div id="hallSet" class="hall-interior hidden" aria-hidden="true">
        <div class="lamp left"></div>
        <div class="lamp right"></div>
        <div class="desk"></div>
        <div class="floor"></div>
      </div>

      <div id="entryDoor" class="entry-door hidden" aria-hidden="true"></div>

      <button id="hotspotCabinet" class="scene-hotspot explore-hotspot hidden" aria-label="调查药柜"></button>
      <button id="hotspotChain" class="scene-hotspot explore-hotspot hidden" aria-label="调查锁链"></button>
      <button id="hotspotRooms" class="scene-hotspot explore-hotspot hidden" aria-label="调查后院房间"></button>

      <button id="guide" class="character guide" aria-label="点击接引人">
        <div class="glow"></div>
        <div class="sprite"></div>
        <div class="label">接引人</div>
      </button>

      <button id="doctor" class="character doctor hidden" aria-label="点击医馆主人">
        <div class="glow"></div>
        <div class="sprite"></div>
        <div class="label">医馆主人</div>
      </button>

      <div id="choices" class="choices hidden" aria-label="对话选项">
        <button id="choiceDoctor" class="choice-btn">1. 直接看病</button>
        <button id="choiceChat" class="choice-btn">2. 和其他人聊聊</button>
      </div>

      <div id="cabinetPuzzle" class="cabinet-puzzle hidden" aria-label="药柜谜题">
        <div class="cabinet-puzzle-card">
          <div class="cabinet-title">药柜谜题</div>
          <div id="cabinetPuzzleText" class="cabinet-text">药柜抽屉微微震动，像在等你重复刚才见到的抓药顺序。</div>
          <div id="cabinetSequence" class="cabinet-sequence">当前顺序：暂无</div>
          <div class="cabinet-grid">
            <button type="button" class="cabinet-btn" data-herb="banxia">半夏</button>
            <button type="button" class="cabinet-btn" data-herb="fuling">茯苓</button>
            <button type="button" class="cabinet-btn" data-herb="chenpi">陈皮</button>
            <button type="button" class="cabinet-btn" data-herb="gancao">甘草</button>
            <button type="button" class="cabinet-btn" data-herb="huangqi">黄芪</button>
            <button type="button" class="cabinet-btn" data-herb="shengjiang">生姜</button>
          </div>
          <div class="cabinet-actions">
            <button id="cabinetResetBtn" type="button" class="btn">重置顺序</button>
            <button id="cabinetCloseBtn" type="button" class="btn">暂时离开</button>
          </div>
        </div>
      </div>
    </section>

    <section class="dialogue-panel" aria-label="对话框">
      <div class="dialogue-inner">
        <div class="speaker-column">
          <div id="speaker" class="nameplate">接引人</div>
          <div id="speakerName" class="speaker-name">接引人</div>
        </div>
        <div class="dialogue-main">
          <div id="dialogueText" class="dialogue-text">你是最后一个到的。</div>
        </div>
        <div class="dialogue-actions">
          <button id="resetBtn" class="btn">重置场景</button>
        </div>
      </div>
    </section>

    <section class="inventory-panel" aria-label="物品栏">
      <div class="inventory-inner">
        <div class="panel-title">物品栏</div>
        <div id="inventoryList" class="inventory-list"></div>
        <div id="itemDetail" class="item-detail">
          <strong>当前目标</strong>
          见到医馆主人
        </div>
      </div>
    </section>
  </div>

  <script src="./js/core/items.js"></script>
  <script src="./js/core/state.js"></script>
  <script src="./js/core/helpers.js"></script>
  <script src="./js/core/speakerMeta.js"></script>
  <script src="./js/core/ui.js"></script>
  <script src="./js/scenes/courtyard.js"></script>
  <script>
    window.APP.scenes.mountCourtyardScene();
  </script>
</body>
</html>
